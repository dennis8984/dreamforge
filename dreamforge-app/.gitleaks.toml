# Gitleaks configuration for DreamForge

[allowlist]
paths = [
  ".env.local.example",
  ".env.example",
  "SECURITY.md",
  "scripts/verify-env.ts",
  ".gitleaks.toml"
]

[[rules]]
id = "runpod-api-key"
description = "Runpod API Key"
regex = '''rpa_[A-Za-z0-9]{40,}'''
tags = ["key", "runpod"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[A-Za-z0-9\-_]{35,}'''
tags = ["key", "google"]

[[rules]]
id = "supabase-key"
description = "Supabase JWT"
regex = '''eyJ[A-Za-z0-9+/=]{100,}'''
tags = ["key", "supabase", "jwt"]

[[rules]]
id = "stripe-key"
description = "Stripe API Key"
regex = '''(sk|pk)_(test|live)_[A-Za-z0-9]{24,}'''
tags = ["key", "stripe"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|access[_-]?token|auth[_-]?token|client[_-]?secret|secret[_-]?key)['"]?\s*[:=]\s*['"]?[A-Za-z0-9\-_]{32,}['"]?'''
tags = ["key", "generic"]