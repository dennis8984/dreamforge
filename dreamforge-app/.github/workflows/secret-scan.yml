name: Secret Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded API keys..."
          if grep -r "rpa_[A-Za-z0-9]\{40,\}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ Found hardcoded Runpod API keys!"
            exit 1
          fi
          if grep -r "AIza[A-Za-z0-9-_]\{35,\}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ Found hardcoded Google API keys!"
            exit 1
          fi
          if grep -r "eyJ[A-Za-z0-9+/=]\{100,\}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ Found hardcoded Supabase keys!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"