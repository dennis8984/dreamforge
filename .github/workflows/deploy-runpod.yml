name: Build and Deploy Runpod Container

on:
  push:
    branches: [ main ]
    paths:
      - 'runpod/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./runpod
        push: true
        tags: |
          dennisf598/dreamforge-gpu:latest
          dennisf598/dreamforge-gpu:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Runpod (Optional - Manual trigger)
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "Docker image pushed successfully!"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/dreamforge-gpu:latest"
        echo ""
        echo "Next steps:"
        echo "1. Go to https://www.runpod.io/console/serverless"
        echo "2. Create new endpoint with this image"
        echo "3. Set environment variables in Runpod"